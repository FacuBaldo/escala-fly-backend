version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: aeroaplicaciones_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=aeroaplicaciones
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data: